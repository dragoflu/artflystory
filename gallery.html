<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея — ARTFLYSTORY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3">
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 40px 24px;
      padding: 60px 60px 80px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .gallery-item { display: flex; flex-direction: column; }

    .gallery-item-title {
      display: inline-block;
      font-family: var(--font-display);
      font-size: clamp(14px, 1.6vw, 20px);
      font-weight: 400;
      color: var(--white-dim);
      letter-spacing: 4px;
      text-transform: uppercase;
      position: relative;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }

    .gallery-item-title::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 40px; height: 1px;
      background: var(--gold);
      transition: width 0.4s ease;
    }

    .gallery-item:hover .gallery-item-title::after { width: 100%; }

    .gallery-card {
      display: block;
      overflow: hidden;
      text-decoration: none;
      border: 1px solid rgba(201, 168, 76, 0.08);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-card:hover {
      border-color: var(--gold);
      box-shadow: 0 4px 32px rgba(201, 168, 76, 0.15);
    }

    .gallery-card img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s ease;
    }

    .gallery-card:hover img { transform: scale(1.04); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <img src="assets/images/лого.PNG" alt="ARTFLYSTORY" style="height:110px;width:auto;">
    </a>
    <ul class="nav-links">
      <li><a href="index.html">НА ГЛАВНУЮ</a></li>
      <li><a href="about.html">О НАС</a></li>
      <li><a href="gallery.html" class="active">ГАЛЛЕРЕЯ</a></li>
      <li><a href="meetings.html">ВСТРЕЧИ</a></li>
      <li><a href="contacts.html">КОНТАКТЫ</a></li>
    </ul>
  </nav>

  <header class="page-header fade-up">
    <h1 class="page-header-title">Галерея</h1>
    <span class="page-header-line"></span>
  </header>

  <main class="gallery-grid">

    <div class="gallery-item fade-up">
      <span class="gallery-item-title">Шелковые декоративные панно</span>
      <a href="silk-panels.html" class="gallery-card">
        <img src="assets/images/галерея/пано_.webp" alt="Шелковые декоративные панно" loading="lazy">
      </a>
    </div>

    <div class="gallery-item fade-up" data-delay="1">
      <span class="gallery-item-title">Шелковые платки</span>
      <a href="accessories.html" class="gallery-card">
        <img src="assets/images/галерея/платки.webp" alt="Шелковые платки" loading="lazy">
      </a>
    </div>

    <div class="gallery-item fade-up" data-delay="2">
      <span class="gallery-item-title">Дизайнерская одежда и аксессуары</span>
      <a href="fashion.html" class="gallery-card">
        <img src="assets/images/галерея/Дизайнерская%20одежда.webp" alt="Дизайнерская одежда и аксессуары" loading="lazy">
      </a>
    </div>

    <div class="gallery-item fade-up" data-delay="3">
      <span class="gallery-item-title">Картины для вашего интерьера</span>
      <a href="paintings.html" class="gallery-card">
        <img src="assets/images/галерея/картины%20для%20вашего%20интерьера.webp" alt="Картины для вашего интерьера" loading="lazy">
      </a>
    </div>

  </main>

  <footer class="page-footer">
    <span class="footer-logo">ARTFLYSTORY</span>
    <span class="footer-copy">&copy; 2024 Анна Флит. Все права защищены.</span>
  </footer>

  <script>
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12 }
    );
    document.querySelectorAll('.fade-up').forEach((el) => observer.observe(el));
  </script>

</body>
</html>
