  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-artwork">
      <div class="circles-composition">

        <!-- 1: Давид -->
        <img class="comp-img" src="assets/images/frame-david.png" alt="Свидание с Давидом" style="width:360px; left:150px; top:173px;">
        <!-- 2: Текстиль — верхний левый -->
        <img class="comp-img" src="assets/images/frame-textile.png" alt="Работа" style="width:215px; left:54px; top:55px;">
        <!-- 3: Цветы 1 — верхний центр -->
        <img class="comp-img" src="assets/images/frame-flowers1.png" alt="Работа" style="width:155px; left:268px; top:71px;">
        <!-- 4: Кольца — верхний правый -->
        <img class="comp-img" src="assets/images/frame-rings.png" alt="" style="width:205px; left:386px; top:71px;" aria-hidden="true">
        <!-- 5: Цветы 2 — левый бок -->
        <img class="comp-img" src="assets/images/frame-flowers2.png" alt="Работа" style="width:133px; left:64px; top:263px;">
        <!-- 8: Кольцо с чёрным фоном (под остальными) -->
        <img class="comp-img" src="assets/images/frame-small-circle.png" alt="" style="width:78px; left:79px; top:405px;" aria-hidden="true">

        <img class="comp-img" src="assets/images/frame-face.png" alt="Работа" style="width:150px; left:126px; top:398px;">
        <!-- 7: Мозаика -->
        <img class="comp-img" src="assets/images/frame-mosaic.png" alt="Работа" style="width:120px; left:70px; top:473px;">
        <!-- 9: Пустое кольцо -->
        <img class="comp-img" src="assets/images/frame-small-ring.png" alt="" style="width:68px; left:83px; top:623px;" aria-hidden="true">

      </div>
    </div>

    <div class="hero-content">
      <span class="hero-brand">ARTFLYSTORY</span>
      <h1 class="hero-title">ИСКУССТВО<br>&amp;<br>ЭЛЕГАНТНОСТЬ</h1>
      <p class="hero-subtitle">Приносят красоту и смысл в жизнь</p>
      <div class="hero-buttons">
        <a href="about.html" class="btn btn-gold">НАЧАТЬ</a>

      </div>
    </div>

      <h3 class="form-title">Давайте поговорим</h3>

      <form>
        <div class="form-group">
          <label>Имя</label>
          <input type="text" placeholder="">
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" placeholder="">
        </div>
        <div class="form-group">
          <label>Сообщение</label>
          <textarea rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-gold btn-full">ОТПРАВИТЬ</button>
      </form>
    </div>
